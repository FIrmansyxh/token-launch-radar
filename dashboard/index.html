<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token Launch Radar</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <h1>Token Launch Radar</h1>
            <p class="kicker" id="kicker">Pre-token protocols ranked by what a launch would be worth</p>
          </div>
        </div>
        <dl class="vitals" id="vitals"></dl>
      </header>

      <nav class="tabs" id="tabs">
        <button type="button" class="tab is-on" data-view="board">Board</button>
        <button type="button" class="tab" data-view="radar">Readiness</button>
        <button type="button" class="tab" data-view="calibration">Calibration</button>
        <button type="button" class="tab" data-view="method">Method</button>
      </nav>

      <section class="controls" id="controls">
        <label class="field grow">
          <span>Search</span>
          <input id="search" type="search" placeholder="Protocol, category or chain" autocomplete="off" />
        </label>
        <label class="field">
          <span>Category</span>
          <select id="category"></select>
        </label>
        <label class="field">
          <span>Chain</span>
          <select id="chain"></select>
        </label>
        <label class="field">
          <span>TVL</span>
          <select id="tvlband">
            <option value="any">Any size</option>
            <option value="mega">Over $1B</option>
            <option value="large">$250M to $1B</option>
            <option value="mid">$50M to $250M</option>
            <option value="small">Under $50M</option>
          </select>
        </label>
        <label class="field">
          <span>Sort</span>
          <select id="sort">
            <option value="value">Implied value</option>
            <option value="readiness">Farm readiness</option>
            <option value="tvl">TVL</option>
            <option value="momentum">7-day momentum</option>
            <option value="youth">Newest listing</option>
          </select>
        </label>
        <label class="check">
          <input id="watchonly" type="checkbox" />
          <span>Watchlist only</span>
        </label>
      </section>

      <div class="chips" id="chips" hidden></div>

      <main id="view" class="view"></main>

      <footer class="colophon">
        <p id="colophon"></p>
      </footer>
    </div>
    <script src="../data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
